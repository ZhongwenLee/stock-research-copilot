spring:
  application:
    name: stock-research-copilot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:stock_research_copilot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  file-storage:
    path: ${FILE_STORAGE_PATH:./data/uploads}
    max-file-size-bytes: ${FILE_MAX_SIZE_BYTES:52428800}
    allowed-extensions:
      - pdf
      - docx
      - txt
      - html
      - htm
  ingest:
    async-enabled: true
    chunk-max-chars: 800
    chunk-overlap-chars: 100
    embedding-batch-size: 16
    embedding-max-retries: 3
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
  vector:
    provider: ${VECTOR_PROVIDER:memory}
  milvus:
    enabled: ${MILVUS_ENABLED:false}
    host: ${MILVUS_HOST:127.0.0.1}
    port: ${MILVUS_PORT:19530}
    collection: ${MILVUS_COLLECTION:document_chunks}
  qa:
    recall-top-k: ${QA_RECALL_TOP_K:20}
    rerank-top-k: ${QA_RERANK_TOP_K:8}
    max-context-chars: ${QA_MAX_CONTEXT_CHARS:6000}
    quote-max-chars: ${QA_QUOTE_MAX_CHARS:240}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.stockresearch.copilot: INFO
