spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stock_research_copilot_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  global-config:
    banner: false

logging:
  level:
    root: WARN
    com.stockresearch.copilot: INFO
